[project]
name = "finbot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "MReza", email = "mohammedr3za@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.11",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "numpy>=2.5.4",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.0",
    "sympy>=1.14.0",
]

[project.scripts]
finbot = "finbot:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
