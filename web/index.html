<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinBot</title>
<meta name="description" content="An open-source finance assistant with exact calculators and official Indian sources. Educational, not advice.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23C85A32'>✳</text></svg>">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
</head>
<body>
<main id="main">
  <div class="eyebrow"><span class="star">✳</span> FinBot &nbsp;·&nbsp; educational, not advice<span id="where" class="where" hidden></span></div>
  <div id="offline" class="offline" hidden>FinBot is offline right now. Please check back later.</div>
  <section id="hero">
    <h1>Ask about money.</h1>
    <p class="sub">Exact calculators. Official sources. Open-source model.</p>
    <div id="examples" class="examples"></div>
  </section>
  <div id="chat"></div>
</main>
<footer id="composer">
  <div id="attachment" class="attachment" hidden></div>
  <form id="form" autocomplete="off">
    <label class="attach" title="Attach a balance sheet (CSV or Excel)">+<input id="file" type="file" accept=".csv,.xlsx,.xls,.txt"></label>
    <textarea id="input" rows="1" placeholder="Ask, or attach a balance sheet…" maxlength="4000"></textarea>
    <button id="send" type="submit" aria-label="Send">↑</button>
  </form>
  <div class="meta"><span id="counter">0/25</span> · <a href="#" id="reset">New conversation</a></div>
</footer>
<script src="app.js"></script>
</body>
</html>
